name: add-review

on:
  workflow_dispatch:
    inputs:
      name:
        description: Name
        required: true
        type: string
      city:
        description: City
        required: true
        type: string
      text:
        description: Review
        required: true
        type: string
  repository_dispatch:
    types: [new-review]
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  add:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Append review
        env:
          NAME: ${{ github.event.client_payload.name || inputs.name }}
          CITY: ${{ github.event.client_payload.city || inputs.city }}
          TEXT: ${{ github.event.client_payload.text || inputs.text }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: python scripts/add_review.py
      - name: Commit
        run: |
          git config user.name tuneea
          git config user.email tuneea@users.noreply.github.com
          git add api/reviews.json
          git diff --cached --quiet || git commit -m "Add review"
          git pull --rebase origin HEAD || true
          git push
      - name: Close issue
        if: github.event.issue.number
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh issue close "${{ github.event.issue.number }}" --comment "Published." || true
